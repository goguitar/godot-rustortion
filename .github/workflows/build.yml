name: Build

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build-libs:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
            lib_name: libgodot_rustortion.so
            artifact_name: godot-rustortion-linux
          - platform: windows
            runner: windows-latest
            lib_name: godot_rustortion.dll
            artifact_name: godot-rustortion-windows
          - platform: macos
            runner: macos-latest
            lib_name: libgodot_rustortion.dylib
            artifact_name: godot-rustortion-macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release library
        run: cargo build --release

      - name: Checkout AudioEffectGate
        uses: actions/checkout@v4
        with:
          repository: Visssarion/audio-gate
          path: audio-gate
          submodules: recursive

      - name: Install SCons
        shell: bash
        run: python -m pip install scons

      - name: Build AudioEffectGate
        shell: bash
        run: |
          cd audio-gate
          scons platform=${{ matrix.platform }} target=template_release

      - name: Prepare platform artifact
        shell: bash
        run: |
          mkdir -p dist/audio_gate
          cp "target/release/${{ matrix.lib_name }}" "dist/${{ matrix.lib_name }}"
          case "${{ matrix.platform }}" in
            linux)
              cp "audio-gate/project/addons/audio_gate/bin/libaudio_gate.linux.release.x86_64.so" \
                "dist/audio_gate/libaudio_gate.linux.release.x86_64.so"
              ;;
            windows)
              cp "audio-gate/project/addons/audio_gate/bin/libaudio_gate.windows.release.x86_64.dll" \
                "dist/audio_gate/libaudio_gate.windows.release.x86_64.dll"
              ;;
            macos)
              cp -R "audio-gate/project/addons/audio_gate/bin/libaudio_gate.macos.release.framework" \
                "dist/audio_gate/libaudio_gate.macos.release.framework"
              ;;
          esac

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/

  package-addon:
    name: Package addon zip
    runs-on: ubuntu-latest
    needs: build-libs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built libraries
        uses: actions/download-artifact@v4
        with:
          pattern: godot-rustortion-*
          merge-multiple: true
          path: dist/libs

      - name: Create addon bundle
        shell: bash
        run: |
          mkdir -p package/addons/godot_rustortion/bin
          cp dist/libs/libgodot_rustortion.so package/addons/godot_rustortion/bin/
          cp dist/libs/godot_rustortion.dll package/addons/godot_rustortion/bin/
          cp dist/libs/libgodot_rustortion.dylib package/addons/godot_rustortion/bin/
          cp dist/libs/libgodot_rustortion.so godot-rustortion-demo/addons/godot_rustortion/bin/
          cp dist/libs/godot_rustortion.dll godot-rustortion-demo/addons/godot_rustortion/bin/
          cp dist/libs/libgodot_rustortion.dylib godot-rustortion-demo/addons/godot_rustortion/bin/

          cp dist/libs/audio_gate/libaudio_gate.linux.release.x86_64.so \
            godot-rustortion-demo/addons/audio_gate/bin/libaudio_gate.linux.debug.x86_64.so
          cp dist/libs/audio_gate/libaudio_gate.linux.release.x86_64.so \
            godot-rustortion-demo/addons/audio_gate/bin/libaudio_gate.linux.release.x86_64.so
          cp dist/libs/audio_gate/libaudio_gate.windows.release.x86_64.dll \
            godot-rustortion-demo/addons/audio_gate/bin/libaudio_gate.windows.debug.x86_64.dll
          cp dist/libs/audio_gate/libaudio_gate.windows.release.x86_64.dll \
            godot-rustortion-demo/addons/audio_gate/bin/libaudio_gate.windows.release.x86_64.dll
          cp -R dist/libs/audio_gate/libaudio_gate.macos.release.framework \
            godot-rustortion-demo/addons/audio_gate/bin/libaudio_gate.macos.debug.framework
          cp -R dist/libs/audio_gate/libaudio_gate.macos.release.framework \
            godot-rustortion-demo/addons/audio_gate/bin/libaudio_gate.macos.release.framework

          cat > package/addons/godot_rustortion/godot-rustortion.gdextension <<'EOF'
          [configuration]
          entry_symbol = "gdext_rust_init"
          compatibility_minimum = "4.5"

          [libraries]
          linux.debug.x86_64 = "res://addons/godot_rustortion/bin/libgodot_rustortion.so"
          linux.release.x86_64 = "res://addons/godot_rustortion/bin/libgodot_rustortion.so"
          windows.debug.x86_64 = "res://addons/godot_rustortion/bin/godot_rustortion.dll"
          windows.release.x86_64 = "res://addons/godot_rustortion/bin/godot_rustortion.dll"
          macos.debug = "res://addons/godot_rustortion/bin/libgodot_rustortion.dylib"
          macos.release = "res://addons/godot_rustortion/bin/libgodot_rustortion.dylib"
          EOF

          cp README.md package/addons/godot_rustortion/README.md

      - name: Create zip artifact
        shell: bash
        run: |
          cd package
          zip -r ../godot-rustortion.zip .

      - name: Upload addon zip
        uses: actions/upload-artifact@v4
        with:
          name: godot-rustortion-addon
          path: godot-rustortion.zip

  publish-release:
    name: Publish release asset
    runs-on: ubuntu-latest
    needs: package-addon
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download packaged addon
        uses: actions/download-artifact@v4
        with:
          name: godot-rustortion-addon
          path: release

      - name: Attach zip to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/godot-rustortion.zip
